<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="index.css">
        <script src="index.js" defer></script>
        <title>To-Do-List</title>
    </head>
    <body>
        <!-- left side panel -->
        <section class="left-side-panel">
            <div class="left-side-title">
                <h1>To-Do-List</h1>
            </div>
            <div class="left-side-menu">
                <div class="btn-menu" id="btn-dashboard">
                    <h3>Dashboard</h3>  
                </div>
                <div class="btn-menu" id="btn-projects">
                    <h3>Projects</h3>          
                </div>
                <div class="btn-menu" id="btn-daily">
                    <h3>Daily List</h3>
                </div>
            </div>
        </section>

        <!-- main panel -->
        <section class="main-panel-section">
            
            <!-- dashboard section -->
            <section class="dashboard-section">
                <div class="title-dashboard">
                    <h2>Dashboard</h2>
                </div>
                <!-- <div class="btn-add-container">
                    <div class="btn-add-list">
                        <h2>+ Add List</h2>
                    </div>
                </div> -->
                <div class="total-list-container">
                    <div class="total-list" id="total-list">
                        <h2>Total List: </h2>
                        <h2 id="total-list-count">0</h2>
                    </div>
                    <div class="total-list" id="total-project-list">
                        <h2>Projects: </h2>
                        <h2 id="total-project-count">0</h2>
                    </div>
                    <div class="total-list" id="total-daily-list">
                        <h2>Daily Tasks: </h2>
                        <h2 id="total-daily-count">0</h2>
                    </div>
                    <div class="total-list" id="total-completed-list">
                        <h2>Completed Tasks: </h2>
                        <h2 id="total-completed-count">0</h2>
                    </div>
                </div>
            </section>

            <!-- project section -->
            <section class="list-section" id="project-section">
                <div class="title-list">
                    <h2>Project Section</h2>
                </div>
                <div class="add-section" id="add-project">
                    <input type="text" class="input" id="input-project" name="input-project">
                    <button class="btn-add" id="btn-add-project">+ Add Project</button>
                </div>
                <div class="list-container" id="project-list-wrapper">
                    <h2>Project List</h2>
                    <div class="task-list-container" id="project-list-container">
                        <ul class="tasks-lists" id="project-list">
                        </ul>
                    </div>
                </div>
            </section>

            <!-- daily section -->
            <section class="list-section" id="daily-section">
                <div class="title-list">
                    <h2>Daily Section</h2>
                </div>
                <div class="add-section" id="add-daily">
                    <input type="text" class="input" id="input-daily" name="input-daily">
                    <button class="btn-add" id="btn-add-daily">+ Add Daily</button>
                </div>
                <div class="list-container" id="daily-list-wrapper">
                    <h2>Daily List</h2>
                    <div class="task-list-container" id="daily-list-container">
                        <ul class="tasks-lists" id="daily-list">
                        </ul>
                    </div>
                </div>
            </section>

</html>
